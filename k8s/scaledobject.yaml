apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: sqs-trigger-auth
  namespace: visionone-filesecurity
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scanner-app-sqs-scaler
  namespace: visionone-filesecurity
spec:
  scaleTargetRef:
    name: scanner-app
    kind: Deployment
  minReplicaCount: 2      # keep 2 warm pollers (redundancy + no cold-start on the next burst)
  maxReplicaCount: <MAX_REPLICAS>
  pollingInterval: 5
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Match the scanner's gentle drain so the app fleet doesn't churn
        # during lulls. scaleUp left at the HPA default (fast) for bursts.
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
          selectPolicy: Min
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "<SQS_QUEUE_URL>"
        queueLength: "5"
        awsRegion: "<AWS_REGION>"
        scaleOnInFlight: "true"
      authenticationRef:
        name: sqs-trigger-auth
# NOTE: KEDA scales ONLY our scanner-app deployment. The V1FS scanner
# (chart-owned) scales via the Helm chart's built-in HPA
# (scanner.autoscaling.enabled=true) — the Trend-supported mechanism.
