# KEDA scales the V1FS SCANNER deployment on SQS queue depth so the scanner
# fleet size tracks the backlog (not CPU). CUSTOMER VARIANT — this replaces the
# chart's CPU/mem HPA, which is Trend's supported mechanism. The chart HPA MUST
# stay disabled (helm/values-base.yaml scanner.autoscaling.enabled=false); two
# autoscalers on one Deployment fight. upgrade.py enforces this invariant.
#
# Requires KEDA + an SQS scan queue (full-auto mode). Reference template only —
# scripts/deploy.sh substitutes the <...> placeholders and applies it.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: scanner-sqs-trigger-auth
  namespace: visionone-filesecurity
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: v1fs-scanner-sqs-scaler
  namespace: visionone-filesecurity
spec:
  scaleTargetRef:
    name: my-release-visionone-filesecurity-scanner
    kind: Deployment
  minReplicaCount: <SCANNER_MIN_REPLICAS>
  maxReplicaCount: <SCANNER_MAX_REPLICAS>
  pollingInterval: 5      # react fast to bursts
  # NOTE: cooldownPeriod only governs the scale-to-0 transition, and only when
  # minReplicaCount is 0. With min >= 1 the scale-DOWN from N->min is governed
  # by the HPA behavior block below, NOT by cooldownPeriod.
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Latency-sensitive profile: absorb bursts fast (scaleUp left at the
        # HPA default), but drain SLOWLY so the fleet does not collapse to the
        # floor during a lull and then have to re-expand from a single pod on
        # the next burst. When the fleet has collapsed, that lone pod takes the
        # whole incoming burst at high concurrency and per-scan latency inflates
        # until KEDA re-scales and pull discovers the new pods (measured: ~3.5x
        # higher median scan latency and ~55% lower throughput vs a warm floor).
        # A gentle scale-down keeps the fleet warm and spread.
        scaleDown:
          stabilizationWindowSeconds: 600   # 10 min of sustained low load before removing any pod
          policies:
            - type: Pods
              value: 1                       # then remove at most 1 pod per minute
              periodSeconds: 60
          selectPolicy: Min                  # most conservative (slowest) policy wins
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "<SQS_QUEUE_URL>"
        queueLength: "<SCANNER_QUEUE_LENGTH>"   # messages per scanner pod
        awsRegion: "<AWS_REGION>"
        scaleOnInFlight: "true"
      authenticationRef:
        name: scanner-sqs-trigger-auth
